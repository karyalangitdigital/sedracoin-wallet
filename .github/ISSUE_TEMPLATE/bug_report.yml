name: "\U0001F41E Bug report"
description: Something isn't working as expected in Sedra Wallet.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! For **security issues**, please use the private [Security Advisory](https://github.com/karyalangitdigital/sedracoin-wallet/security/advisories/new) form instead — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '...'
        2. Tap '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      placeholder: What you observed instead.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Which Sedra network were you connected to?
      options:
        - Mainnet
        - Testnet (10sec)
        - Testnet (11sec)
        - Devnet
        - Simnet
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: e.g. 1.3.0+21
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / device
      placeholder: e.g. Android 14 — Pixel 7, or iOS 18 — iPhone 15 Pro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Please redact any seed phrase, private key, or address before pasting.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag-and-drop images or a short GIF here.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
        - label: I can reproduce this on the latest build.
          required: true
        - label: This is not a security vulnerability (I would use the private advisory form).
          required: true
